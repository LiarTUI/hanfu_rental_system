name: Deploy Frontend

on:
  push:
    branches: [master]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web & admin
        run: |
          pnpm --filter web build
          pnpm --filter admin build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 47.97.253.29 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload web
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" packages/web/dist/ root@47.97.253.29:/var/www/hanfu/web/

      - name: Upload admin
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" packages/admin/dist/ root@47.97.253.29:/var/www/hanfu/admin/

      - name: Fix permissions
        run: ssh -i ~/.ssh/deploy_key root@47.97.253.29 "chmod -R 755 /var/www/hanfu"
